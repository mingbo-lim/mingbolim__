<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>내역 추가 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <style>

    .write-page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 65px 20px 100px;
    }

    .write-head {
      margin-bottom: 30px;
    }

    .write-head a {
      display: inline-block;
      margin-bottom: 22px;

      color: #7b807a;
      font-size: 12px;
      text-decoration: none;
    }

    .write-head h1 {
      margin: 0 0 8px;

      font-size: 28px;
      letter-spacing: -1px;
    }

    .write-head p {
      margin: 0;

      color: #969990;

      font-family: "Gowun Dodum", sans-serif;
      font-size: 13px;
    }

    .write-card {
      padding: 35px;

      background: #fffefa;

      border: 1px solid #e6e2d9;
      border-radius: 16px;

      box-shadow:
        0 12px 35px
        rgba(70, 65, 55, 0.06);
    }

    .type-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-bottom: 28px;
    }

    .type-button {
      height: 46px;

      border: 1px solid #deddd7;
      border-radius: 8px;

      background: white;
      color: #888;

      font-family: inherit;
      font-size: 13px;

      cursor: pointer;
    }

    .type-button.active {
      border-color: #6f9d7d;

      background: #edf4ed;
      color: #4e7f5f;

      font-weight: 600;
    }

    .type-button.income.active {
      border-color: #d7b76d;

      background: #fbf4df;
      color: #9b762c;
    }

    .form-group {
      margin-bottom: 21px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 12px;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid #dcdad4;
      border-radius: 8px;

      background: white;

      font-family: inherit;
      font-size: 13px;

      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #75a284;

      box-shadow:
        0 0 0 3px
        rgba(78, 138, 104, 0.08);
    }

    .category-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .amount-wrap {
      position: relative;
    }

    .amount-wrap span {
      position: absolute;

      top: 50%;
      right: 15px;

      transform: translateY(-50%);

      color: #999;

      font-size: 12px;
    }

    .amount-wrap input {
      padding-right: 40px;
    }

    .save-button {
      width: 100%;
      height: 50px;

      margin-top: 8px;

      border: 0;
      border-radius: 8px;

      background: #5f9270;
      color: white;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .save-button:hover {
      background: #477b5a;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 22px;

      margin-top: 15px;

      color: #c05d55;

      font-size: 11px;
      text-align: center;
    }

    .message.success {
      color: #4e8a68;
    }

    .user-info {
      margin-bottom: 18px;

      color: #8b9089;

      font-size: 11px;
    }

    @media (max-width: 600px) {

      .write-page {
        padding-top: 40px;
      }

      .write-card {
        padding: 25px 20px;
      }

      .category-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

<header class="topbar">

  <div class="topbar-inner">

    <a
      href="index.html"
      class="brand"
    >
      <span class="brand-leaf">
        🌿
      </span>

      <strong>
        나의 가계부
      </strong>
    </a>

  </div>

</header>


<main class="write-page">

  <div class="write-head">

    <a href="index.html">
      ← 가계부로 돌아가기
    </a>

    <h1>
      오늘의 기록
    </h1>

    <p>
      작은 소비도 차근차근 기록해보세요 🌿
    </p>

  </div>


  <div class="write-card">

    <div
      class="user-info"
      id="userInfo"
    >
      로그인 정보를 확인하고 있어요...
    </div>


    <div class="type-buttons">

      <button
        type="button"
        id="expenseButton"
        class="type-button active"
      >
        − 지출
      </button>

      <button
        type="button"
        id="incomeButton"
        class="type-button income"
      >
        + 수입
      </button>

    </div>


    <form id="writeForm">

      <div class="form-group">

        <label for="date">
          날짜
        </label>

        <input
          id="date"
          type="date"
          required
        >

      </div>


      <div class="form-group">

        <label for="name">
          내용
        </label>

        <input
          id="name"
          type="text"
          maxlength="50"
          placeholder="예: 점심, 월급, 커피"
          required
        >

      </div>


      <div class="form-group">

        <label>
          항목
        </label>

        <div class="category-grid">

          <select
            id="mainCategory"
            required
          ></select>

          <select
            id="subCategory"
            required
          ></select>

        </div>

      </div>


      <div class="form-group">

        <label for="amount">
          금액
        </label>

        <div class="amount-wrap">

          <input
            id="amount"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="0"
            required
          >

          <span>
            원
          </span>

        </div>

      </div>


      <button
        id="saveButton"
        class="save-button"
        type="submit"
      >
        기록 저장하기
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>

</main>


<script>

/* =========================================
   새 회원 시스템 API
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwI2qqnKHp2CRumgKEnVO8arJaV77vhYPydrV_mTugmIguVDRuuBfwTo-F0Do4h6gYx5A/exec";


/* =========================================
   로그인 토큰
========================================= */

const token =
  sessionStorage.getItem(
    "ledgerToken"
  );


if (!token) {

  window.location.replace(
    "login.html"
  );

}


/* =========================================
   카테고리
========================================= */

const EXPENSE_CATEGORIES = {

  "식비": [
    "장보기",
    "외식",
    "배달",
    "간식",
    "기타"
  ],

  "고정지출": [
    "통신비",
    "보험",
    "구독",
    "관리비",
    "공과금",
    "기타"
  ],

  "커피": [
    "카페",
    "기타"
  ],

  "사교모임": [
    "친구모임",
    "회식",
    "데이트",
    "모임",
    "기타"
  ],

  "교통비": [
    "대중교통",
    "택시",
    "주유",
    "주차",
    "기타"
  ],

  "자기계발비": [
    "책",
    "강의",
    "교육",
    "운동",
    "취미",
    "기타"
  ],

  "경조사비": [
    "축의금",
    "부의금",
    "선물",
    "기타"
  ],

  "기타": [
    "생활용품",
    "쇼핑",
    "의료",
    "미용",
    "기타"
  ]

};


const INCOME_CATEGORIES = {

  "수입": [
    "급여",
    "부수입",
    "용돈",
    "환급",
    "기타"
  ]

};


/* =========================================
   현재 입력 종류
========================================= */

let recordType =
  "expense";


const expenseButton =
  document.getElementById(
    "expenseButton"
  );


const incomeButton =
  document.getElementById(
    "incomeButton"
  );


const mainCategory =
  document.getElementById(
    "mainCategory"
  );


const subCategory =
  document.getElementById(
    "subCategory"
  );


const writeForm =
  document.getElementById(
    "writeForm"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* =========================================
   서버 요청
========================================= */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=UTF-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  if (!response.ok) {

    throw new Error(
      "서버 응답 오류"
    );

  }


  return await response.json();

}


/* =========================================
   로그인 확인
========================================= */

async function verifyLogin() {

  try {

    const result =
      await apiRequest({
        action: "verify",
        token: token
      });


    if (
      !result.success ||
      result.loginRequired
    ) {

      goToLogin();

      return;

    }


    const nickname =
      result.nickname ||
      result.userId ||
      "회원";


    document.getElementById(
      "userInfo"
    ).textContent =
      nickname +
      "님의 기록 🌿";


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      "로그인 정보를 확인하지 못했어요.";

  }

}


/* =========================================
   로그인 페이지 이동
========================================= */

function goToLogin() {

  sessionStorage.removeItem(
    "ledgerToken"
  );

  sessionStorage.removeItem(
    "ledgerNickname"
  );


  window.location.replace(
    "login.html"
  );

}


/* =========================================
   오늘 날짜
========================================= */

function setToday() {

  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    );


  document.getElementById(
    "date"
  ).value =
    year +
    "-" +
    month +
    "-" +
    day;

}


/* =========================================
   카테고리 표시
========================================= */

function renderCategories() {

  const categories =
    recordType === "expense"
      ? EXPENSE_CATEGORIES
      : INCOME_CATEGORIES;


  mainCategory.innerHTML =
    "";


  Object.keys(
    categories
  ).forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      mainCategory.appendChild(
        option
      );

    }
  );


  renderSubCategories();

}


/* =========================================
   세부 카테고리
========================================= */

function renderSubCategories() {

  const categories =
    recordType === "expense"
      ? EXPENSE_CATEGORIES
      : INCOME_CATEGORIES;


  const selected =
    mainCategory.value;


  const subList =
    categories[selected] ||
    [];


  subCategory.innerHTML =
    "";


  subList.forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      subCategory.appendChild(
        option
      );

    }
  );

}


mainCategory.addEventListener(
  "change",
  renderSubCategories
);


/* =========================================
   지출 선택
========================================= */

expenseButton.addEventListener(
  "click",
  function() {

    recordType =
      "expense";


    expenseButton.classList.add(
      "active"
    );


    incomeButton.classList.remove(
      "active"
    );


    renderCategories();

  }
);


/* =========================================
   수입 선택
========================================= */

incomeButton.addEventListener(
  "click",
  function() {

    recordType =
      "income";


    incomeButton.classList.add(
      "active"
    );


    expenseButton.classList.remove(
      "active"
    );


    renderCategories();

  }
);


/* =========================================
   저장
========================================= */

writeForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const date =
      document
        .getElementById("date")
        .value;


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const amountInput =
      Number(
        document
          .getElementById("amount")
          .value
      );


    if (
      !date ||
      !name ||
      !mainCategory.value ||
      !subCategory.value ||
      !Number.isFinite(amountInput) ||
      amountInput <= 0
    ) {

      message.classList.remove(
        "success"
      );


      message.textContent =
        "입력 내용을 확인해주세요.";


      return;

    }


    /*
      지출 = 음수
      수입 = 양수
    */

    const amount =
      recordType === "expense"
        ? -Math.abs(amountInput)
        : Math.abs(amountInput);


    const category =
      mainCategory.value +
      " > " +
      subCategory.value;


    saveButton.disabled =
      true;


    saveButton.textContent =
      "저장 중...";


    message.classList.remove(
      "success"
    );


    message.textContent =
      "";


    try {

      const result =
        await apiRequest({

          action: "add",

          token: token,

          date: date,

          name: name,

          category: category,

          amount: amount

        });


      if (
        result.loginRequired
      ) {

        goToLogin();

        return;

      }


      if (!result.success) {

        throw new Error(
          result.message ||
          "저장하지 못했습니다."
        );

      }


      message.classList.add(
        "success"
      );


      message.textContent =
        "기록했어요 🌿";


      saveButton.textContent =
        "저장 완료";


      /*
        잠깐 보여준 뒤
        메인 가계부로 이동
      */

      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        700
      );


      return;


    } catch (error) {

      console.error(
        "저장 오류:",
        error
      );


      message.textContent =
        error.message ||
        "저장 중 오류가 발생했어요.";

    }


    saveButton.disabled =
      false;


    saveButton.textContent =
      "기록 저장하기";

  }
);


/* =========================================
   시작
========================================= */

setToday();

renderCategories();

verifyLogin();

</script>

</body>
</html>
