<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>내역 추가 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="topbar">

  <div class="topbar-inner">

    <a href="index.html" class="brand">
      <span class="brand-leaf">🌿</span>
      <strong>나의 가계부</strong>
    </a>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="index.html#recent">내역</a>
      <a href="index.html#budget">예산</a>
      <a href="index.html#analysis">분석</a>
    </nav>

    <div class="today-message">
      오늘도 차근차근 기록해요
    </div>

  </div>

</header>


<main class="write-page">

  <a
    href="index.html"
    class="back"
  >
    ← 가계부로 돌아가기
  </a>


  <div class="write-header">

    <div>

      <span class="write-label">
        NEW RECORD
      </span>

      <h1>
        오늘의 내역 기록하기
      </h1>

      <p>
        작은 소비도 차근차근 기록해보세요 🌿
      </p>

    </div>


    <div class="sticky-note">

      <span>🌼</span>

      <p>
        오늘의 기록이<br>
        <strong>내일의 여유</strong>가 돼요.
      </p>

    </div>

  </div>


  <form
    class="write-form"
    id="recordForm"
  >

    <!-- 지출 / 수입 -->
    <div class="form-group">

      <label>
        어떤 내역인가요?
      </label>

      <div class="type-grid">

        <label class="type-button">

          <input
            type="radio"
            name="recordType"
            value="expense"
            checked
          >

          <span class="expense-type">
            − 지출
          </span>

        </label>


        <label class="type-button">

          <input
            type="radio"
            name="recordType"
            value="income"
          >

          <span class="income-type">
            + 수입
          </span>

        </label>

      </div>

    </div>


    <!-- 날짜 -->
    <div class="form-group">

      <label for="date">
        날짜
      </label>

      <input
        id="date"
        type="date"
        required
      >

    </div>


    <!-- 이름 -->
    <div class="form-group">

      <label for="name">
        내역 이름
      </label>

      <input
        id="name"
        type="text"
        maxlength="50"
        placeholder="예: 점심, 카페, 월급"
        required
      >

      <p class="field-help">
        무엇에 사용했는지 간단하게 적어주세요.
      </p>

    </div>


    <!-- 금액 -->
    <div class="form-group">

      <label for="amount">
        금액
      </label>

      <div class="amount-field">

        <span>₩</span>

        <input
          id="amount"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="0"
          required
        >

        <strong>원</strong>

      </div>

    </div>


    <!-- 카테고리 -->
    <div class="form-two-column">

      <div class="form-group">

        <label for="mainCategory">
          항목
        </label>

        <select
          id="mainCategory"
          required
        ></select>

      </div>


      <div class="form-group">

        <label for="subCategory">
          세부 항목
        </label>

        <select
          id="subCategory"
          required
        ></select>

      </div>

    </div>


    <!-- 결제수단 -->
    <div class="form-group">

      <label for="payment">
        결제수단
      </label>

      <select id="payment">

        <option value="카드">
          카드
        </option>

        <option value="현금">
          현금
        </option>

        <option value="계좌이체">
          계좌이체
        </option>

        <option value="기타">
          기타
        </option>

      </select>

      <p class="field-help">
        현재 결제수단은 화면에서만 선택하며
        시트에는 저장되지 않아요.
      </p>

    </div>


    <!-- 상태 메시지 -->
    <div
      class="form-notice"
      id="formNotice"
    >

      <span>🌿</span>

      <div>
        내역을 입력한 뒤 기록하기를 눌러주세요.
      </div>

    </div>


    <!-- 버튼 -->
    <div class="form-buttons">

      <a href="index.html">
        취소
      </a>

      <button
        type="submit"
        id="saveButton"
      >
        기록하기
      </button>

    </div>

  </form>


  <div class="write-decoration">

    <span class="plant-emoji">
      🪴
    </span>

    <p>
      완벽하게 기록하지 않아도 괜찮아요.<br>
      꾸준히 남기는 것부터 시작해요.
    </p>

  </div>

</main>


<script>

/* =========================================
   서버 설정
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzJrc641rIQ0R14IigoO6YdeflFJLn0w6iFCgOdnrtfjNwcbrKIhGAe6UIkXCo-X2k4YA/exec";


const token =
  sessionStorage.getItem(
    "ledgerToken"
  );


/* 토큰 자체가 없으면 로그인 화면으로 */

if (!token) {

  window.location.replace(
    "login.html"
  );

}


/* =========================================
   카테고리
========================================= */

const EXPENSE_CATEGORIES = {

  "식비": [
    "장보기",
    "외식",
    "배달",
    "간식",
    "기타"
  ],

  "고정지출": [
    "통신비",
    "보험",
    "구독",
    "관리비",
    "공과금",
    "기타"
  ],

  "커피": [
    "카페",
    "기타"
  ],

  "사교모임": [
    "친구모임",
    "회식",
    "데이트",
    "모임",
    "기타"
  ],

  "교통비": [
    "대중교통",
    "택시",
    "주유",
    "주차",
    "기타"
  ],

  "자기계발비": [
    "책",
    "강의",
    "교육",
    "운동",
    "취미",
    "기타"
  ],

  "경조사비": [
    "축의금",
    "부의금",
    "선물",
    "기타"
  ],

  "기타": [
    "생활용품",
    "쇼핑",
    "의료",
    "미용",
    "기타"
  ]

};


const INCOME_CATEGORIES = {

  "수입": [
    "급여",
    "부수입",
    "용돈",
    "환급",
    "기타"
  ]

};


/* =========================================
   요소
========================================= */

const recordForm =
  document.getElementById(
    "recordForm"
  );


const dateInput =
  document.getElementById(
    "date"
  );


const nameInput =
  document.getElementById(
    "name"
  );


const amountInput =
  document.getElementById(
    "amount"
  );


const mainCategory =
  document.getElementById(
    "mainCategory"
  );


const subCategory =
  document.getElementById(
    "subCategory"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const formNotice =
  document.getElementById(
    "formNotice"
  );


/* =========================================
   오늘 날짜 자동 입력
========================================= */

function setToday() {

  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      today.getDate()
    ).padStart(2, "0");


  dateInput.value =
    year +
    "-" +
    month +
    "-" +
    day;

}


setToday();


/* =========================================
   현재 지출/수입 종류
========================================= */

function getRecordType() {

  return document
    .querySelector(
      'input[name="recordType"]:checked'
    )
    .value;

}


/* =========================================
   큰 카테고리 만들기
========================================= */

function updateMainCategories() {

  const type =
    getRecordType();


  const categories =
    type === "income"
      ? INCOME_CATEGORIES
      : EXPENSE_CATEGORIES;


  mainCategory.innerHTML =
    "";


  Object.keys(
    categories
  ).forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      mainCategory.appendChild(
        option
      );

    }
  );


  updateSubCategories();

}


/* =========================================
   세부 카테고리 만들기
========================================= */

function updateSubCategories() {

  const type =
    getRecordType();


  const categories =
    type === "income"
      ? INCOME_CATEGORIES
      : EXPENSE_CATEGORIES;


  const selectedMain =
    mainCategory.value;


  const subCategories =
    categories[selectedMain] ||
    [];


  subCategory.innerHTML =
    "";


  subCategories.forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      subCategory.appendChild(
        option
      );

    }
  );

}


/* =========================================
   지출/수입 변경
========================================= */

document
  .querySelectorAll(
    'input[name="recordType"]'
  )
  .forEach(
    function(input) {

      input.addEventListener(
        "change",
        updateMainCategories
      );

    }
  );


mainCategory.addEventListener(
  "change",
  updateSubCategories
);


updateMainCategories();


/* =========================================
   서버 요청
========================================= */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=UTF-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  return await response.json();

}


/* =========================================
   로그인 만료
========================================= */

function goToLogin() {

  sessionStorage.removeItem(
    "ledgerToken"
  );


  window.location.replace(
    "login.html"
  );

}


/* =========================================
   실제 토큰 확인
========================================= */

async function verifyLogin() {

  try {

    const result =
      await apiRequest({
        action: "verify",
        token: token
      });


    if (!result.success) {

      goToLogin();

      return false;

    }


    return true;


  } catch (error) {

    console.error(error);


    showNotice(
      "서버 연결을 확인해주세요.",
      "error"
    );


    return false;

  }

}


/* =========================================
   안내 메시지
========================================= */

function showNotice(
  text,
  type
) {

  formNotice.className =
    "form-notice";


  if (type === "success") {

    formNotice.classList.add(
      "notice-success"
    );


    formNotice.innerHTML =
      "<span>✓</span><div>" +
      escapeHTML(text) +
      "</div>";


  } else if (
    type === "error"
  ) {

    formNotice.classList.add(
      "notice-error"
    );


    formNotice.innerHTML =
      "<span>!</span><div>" +
      escapeHTML(text) +
      "</div>";


  } else {

    formNotice.innerHTML =
      "<span>🌿</span><div>" +
      escapeHTML(text) +
      "</div>";

  }

}


/* =========================================
   저장
========================================= */

recordForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const type =
      getRecordType();


    const date =
      dateInput.value;


    const name =
      nameInput.value.trim();


    const enteredAmount =
      Number(
        amountInput.value
      );


    if (
      !date ||
      !name ||
      !Number.isFinite(
        enteredAmount
      ) ||
      enteredAmount <= 0
    ) {

      showNotice(
        "입력한 내용을 다시 확인해주세요.",
        "error"
      );

      return;

    }


    const category =
      mainCategory.value +
      " > " +
      subCategory.value;


    /*
      지출 = 음수
      수입 = 양수
    */

    const amount =
      type === "expense"
        ? -Math.abs(
            enteredAmount
          )
        : Math.abs(
            enteredAmount
          );


    saveButton.disabled =
      true;


    saveButton.textContent =
      "저장 중...";


    showNotice(
      "내역을 저장하고 있어요.",
      "normal"
    );


    try {

      const result =
        await apiRequest({

          action: "add",

          token: token,

          date: date,

          name: name,

          category: category,

          amount: amount

        });


      if (
        result.loginRequired
      ) {

        goToLogin();

        return;

      }


      if (!result.success) {

        throw new Error(
          result.message ||
          "저장하지 못했습니다."
        );

      }


      showNotice(
        "내역이 저장되었어요 🌿",
        "success"
      );


      /*
        잠시 성공 메시지를 보여준 뒤
        홈으로 이동
      */

      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        700
      );


    } catch (error) {

      console.error(error);


      showNotice(
        error.message ||
        "저장 중 오류가 발생했어요.",
        "error"
      );


      saveButton.disabled =
        false;


      saveButton.textContent =
        "기록하기";

    }

  }
);


/* =========================================
   HTML 안전 처리
========================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   페이지 시작
========================================= */

async function startPage() {

  if (!token) {
    return;
  }


  const loggedIn =
    await verifyLogin();


  if (!loggedIn) {
    return;
  }

}


startPage();

</script>


</body>
</html>
