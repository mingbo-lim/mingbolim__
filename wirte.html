<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>내역 추가 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    <span class="logo-mark">☘</span>
    <span>나의 가계부</span>
  </a>

  <nav>
    <a href="index.html">홈</a>
    <a href="index.html#history">내역</a>
    <a href="index.html#budget">예산</a>
    <a href="index.html#analysis">분석</a>
  </nav>

  <div class="header-note">write it down ✎</div>

</header>


<main class="write-page">

  <a href="index.html" class="back-link">
    ← 홈으로 돌아가기
  </a>


  <section class="write-intro">

    <div>
      <span class="eyebrow">NEW RECORD</span>

      <h1>
        새로운 내역을<br>
        기록해요 <span>✎</span>
      </h1>

      <p>
        오늘 들어오거나 나간 돈을<br>
        간단하게 기록해보세요.
      </p>
    </div>


    <div class="write-note">
      <span>little note</span>

      <strong>
        작은 기록이<br>
        큰 변화를 만들어요.
      </strong>

      <small>:)</small>
    </div>

  </section>


  <form class="record-form">

    <div class="form-group">

      <label>구분</label>

      <div class="type-selector">

        <label>
          <input type="radio" name="type" checked>
          <span class="expense-select">↑ &nbsp; 지출</span>
        </label>

        <label>
          <input type="radio" name="type">
          <span class="income-select">↓ &nbsp; 수입</span>
        </label>

      </div>

    </div>


    <div class="form-group">

      <label for="date">날짜</label>

      <input
        type="date"
        id="date"
        value="2026-09-20"
      >

    </div>


    <div class="form-group">

      <label for="name">이름 <small>(사용처·내용)</small></label>

      <input
        type="text"
        id="name"
        placeholder="예: 스타벅스, 이마트 장보기"
      >

    </div>


    <div class="form-group">

      <label for="amount">금액</label>

      <div class="money-input">
        <span>₩</span>

        <input
          type="number"
          id="amount"
          placeholder="0"
        >

        <b>원</b>
      </div>

    </div>


    <div class="form-two">

      <div class="form-group">
        <label for="category">대분류</label>

        <select id="category">
          <option>식비</option>
          <option>교통비</option>
          <option>쇼핑</option>
          <option>고정지출</option>
          <option>경조사비</option>
          <option>여가</option>
          <option>기타</option>
        </select>
      </div>


      <div class="form-group">
        <label for="subcategory">세부항목</label>

        <select id="subcategory">
          <option>카페</option>
          <option>외식</option>
          <option>배달</option>
          <option>장보기</option>
        </select>
      </div>

    </div>


    <div class="form-group">

      <label for="payment">결제수단</label>

      <select id="payment">
        <option>체크카드</option>
        <option>계좌이체</option>
        <option>현금</option>
        <option>기타</option>
      </select>

    </div>


    <div class="preview-notice">

      <span>☀</span>

      <div>
        <strong>지금은 화면을 확인하는 단계예요.</strong>
        <p>입력해도 실제로 저장되지는 않아요.</p>
      </div>

    </div>


    <div class="form-actions">

      <a href="index.html" class="cancel-button">
        취소
      </a>

      <button type="button" class="save-button">
        기록하기
      </button>

    </div>

  </form>


  <div class="write-bottom">

    <span class="small-plant">☘</span>

    <p>
      쓰는 만큼<br>
      더 나를 알게 돼요.
      <strong>♡</strong>
    </p>

  </div>

</main>

</body>
</html>
