<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>내역 추가 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>


<header class="topbar">

  <div class="topbar-inner">

    <a href="index.html" class="brand">
      <span class="brand-leaf">🌿</span>
      <strong>나의 가계부</strong>
    </a>

    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="index.html#recent">내역</a>
      <a href="index.html#budget">예산</a>
      <a href="index.html#analysis">분석</a>
      <a href="#">항목관리</a>
    </nav>

    <div></div>

  </div>

</header>


<main class="write-page">

  <a href="index.html" class="back">
    ← 홈으로 돌아가기
  </a>


  <section class="write-header">

    <div>

      <span class="write-label">
        NEW RECORD
      </span>

      <h1>
        새로운 내역을 기록해요 ✏️
      </h1>

      <p>
        오늘 들어오거나 나간 돈을 간단하게 기록해보세요.
      </p>

    </div>


    <div class="sticky-note">

      <span>🌿</span>

      <p>
        작은 기록이<br>
        큰 변화를 만들어요.
      </p>

      <strong>:)</strong>

    </div>

  </section>


  <form class="write-form">

    <div class="form-group">

      <label>구분</label>

      <div class="type-grid">

        <label class="type-button">
          <input type="radio" name="type" checked>
          <span class="expense-type">
            ↑ &nbsp; 지출
          </span>
        </label>

        <label class="type-button">
          <input type="radio" name="type">
          <span class="income-type">
            ↓ &nbsp; 수입
          </span>
        </label>

      </div>

    </div>


    <div class="form-group">

      <label for="date">
        날짜
      </label>

      <input
        id="date"
        type="date"
        value="2026-09-20"
      >

    </div>


    <div class="form-group">

      <label for="name">
        이름 (사용처·내용)
      </label>

      <input
        id="name"
        type="text"
        placeholder="예: 스타벅스, 이마트 장보기"
      >

    </div>


    <div class="form-group">

      <label for="amount">
        금액
      </label>

      <div class="amount-field">

        <span>₩</span>

        <input
          id="amount"
          type="number"
          placeholder="0"
        >

        <strong>원</strong>

      </div>

    </div>


    <div class="form-two-column">

      <div class="form-group">

        <label for="category">
          대분류
        </label>

        <select id="category">
          <option>식비</option>
          <option>교통비</option>
          <option>쇼핑</option>
          <option>고정지출</option>
          <option>경조사비</option>
          <option>여가</option>
          <option>기타</option>
        </select>

      </div>


      <div class="form-group">

        <label for="subcategory">
          세부항목
        </label>

        <select id="subcategory">
          <option>카페</option>
          <option>외식</option>
          <option>배달</option>
          <option>장보기</option>
        </select>

      </div>

    </div>


    <div class="form-group">

      <label for="payment">
        결제수단
      </label>

      <select id="payment">
        <option>체크카드</option>
        <option>계좌이체</option>
        <option>현금</option>
        <option>기타</option>
      </select>

    </div>


    <div class="form-notice">

      <span>ⓘ</span>

      <div>
        지금은 화면을 확인하는 단계라서<br>
        입력해도 실제로 저장되지는 않아요.
      </div>

    </div>


    <div class="form-buttons">

      <a href="index.html">
        취소
      </a>

      <button type="button">
        기록하기
      </button>

    </div>

  </form>


  <div class="write-decoration">

    <span class="plant-emoji">🌿</span>

    <p>
      쓰는 만큼<br>
      더 나를 알게 돼요.<br>
      :)
    </p>

  </div>

</main>

</body>
</html>
