<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>나의 가계부 - 로그인</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f6f3eb;
      color: #24352b;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .logo-area h1 {
      margin: 0;
      font-size: 26px;
      color: #315c45;
    }

    .logo-area p {
      margin: 8px 0 0;
      font-size: 14px;
      color: #7b857e;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow:
        0 8px 30px rgba(42, 68, 52, 0.08);
    }

    .tabs {
      display: flex;
      background: #f1f3ed;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 26px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;

      font-size: 15px;
      font-weight: 700;
      color: #7b857e;
    }

    .tab.active {
      background: #ffffff;
      color: #315c45;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 700;
      color: #405248;
    }

    input {
      width: 100%;
      height: 48px;

      border: 1px solid #d9ded8;
      border-radius: 12px;

      padding: 0 14px;

      font-size: 15px;
      color: #26372d;
      background: #ffffff;

      outline: none;
    }

    input:focus {
      border-color: #63866f;
      box-shadow:
        0 0 0 3px rgba(99, 134, 111, 0.12);
    }

    input::placeholder {
      color: #adb4af;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: #939b95;
    }

    .main-button {
      width: 100%;
      height: 50px;

      border: none;
      border-radius: 13px;

      background: #315c45;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      margin-top: 4px;
    }

    .main-button:hover {
      background: #294d3a;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      display: none;

      margin-top: 18px;
      padding: 12px 14px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fff1f0;
      color: #a8433d;
    }

    .message.success {
      display: block;
      background: #eef7f0;
      color: #315c45;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;

      font-size: 12px;
      color: #9aa19c;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px;
        border-radius: 20px;
      }

      .logo-area h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo-area">
      <div class="logo">🌿</div>
      <h1>나의 가계부</h1>
      <p>소소한 소비도 차곡차곡 기록해요.</p>
    </div>

    <section class="card">

      <div class="tabs">
        <button
          id="loginTab"
          class="tab active"
          type="button"
          onclick="showTab('login')"
        >
          로그인
        </button>

        <button
          id="signupTab"
          class="tab"
          type="button"
          onclick="showTab('signup')"
        >
          회원가입
        </button>
      </div>


      <!-- 로그인 -->

      <div
        id="loginForm"
        class="form active"
      >

        <div class="field">
          <label for="loginId">
            아이디
          </label>

          <input
            id="loginId"
            type="text"
            autocomplete="username"
            placeholder="아이디를 입력해주세요"
          />
        </div>


        <div class="field">
          <label for="loginPassword">
            비밀번호
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>


        <button
          id="loginButton"
          class="main-button"
          type="button"
          onclick="login()"
        >
          로그인
        </button>

      </div>


      <!-- 회원가입 -->

      <div
        id="signupForm"
        class="form"
      >

        <div class="field">
          <label for="nickname">
            닉네임
          </label>

          <input
            id="nickname"
            type="text"
            maxlength="20"
            placeholder="사용할 닉네임을 입력해주세요"
          />
        </div>


        <div class="field">
          <label for="signupId">
            아이디
          </label>

          <input
            id="signupId"
            type="text"
            maxlength="20"
            autocomplete="username"
            placeholder="아이디를 입력해주세요"
          />

          <div class="hint">
            영문, 숫자, _, -를 사용해 4~20자로 입력해주세요.
          </div>
        </div>


        <div class="field">
          <label for="signupPassword">
            비밀번호
          </label>

          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            placeholder="비밀번호를 입력해주세요"
          />

          <div class="hint">
            비밀번호는 8자 이상 입력해주세요.
          </div>
        </div>


        <div class="field">
          <label for="signupPasswordConfirm">
            비밀번호 확인
          </label>

          <input
            id="signupPasswordConfirm"
            type="password"
            autocomplete="new-password"
            placeholder="비밀번호를 한 번 더 입력해주세요"
          />
        </div>


        <button
          id="signupButton"
          class="main-button"
          type="button"
          onclick="signup()"
        >
          회원가입
        </button>

      </div>


      <div
        id="message"
        class="message"
      ></div>

    </section>


    <div class="footer-text">
      나만의 작은 가계부 🌱
    </div>

  </main>


  <script>

    /* =========================================
       API 주소
    ========================================= */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxtLbgJ80BlSABX7utMyeeGQZ5C6Pt8xItzE6p12Xa6AcRPIAawmpMC4eh3M6V-uLcWqA/exec";


    /* =========================================
       탭 전환
    ========================================= */

    function showTab(type) {
      clearMessage();

      const loginTab =
        document.getElementById("loginTab");

      const signupTab =
        document.getElementById("signupTab");

      const loginForm =
        document.getElementById("loginForm");

      const signupForm =
        document.getElementById("signupForm");


      if (type === "login") {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");

        loginForm.classList.add("active");
        signupForm.classList.remove("active");

      } else {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");

        signupForm.classList.add("active");
        loginForm.classList.remove("active");
      }
    }


    /* =========================================
       메시지
    ========================================= */

    function clearMessage() {
      const box =
        document.getElementById("message");

      box.textContent = "";
      box.className = "message";
    }


    function showMessage(
      text,
      type = "error"
    ) {
      const box =
        document.getElementById("message");

      box.textContent = text;
      box.className =
        "message " + type;
    }


    /* =========================================
       API 요청
    ========================================= */

    async function apiRequest(data) {
      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify(data)
          }
        );

      const text =
        await response.text();

      try {
        return JSON.parse(text);

      } catch (error) {
        console.error(text);

        throw new Error(
          "서버 응답을 확인할 수 없습니다."
        );
      }
    }


    /* =========================================
       로그인
    ========================================= */

    async function login() {
      clearMessage();

      const userId =
        document
          .getElementById("loginId")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!userId || !password) {
        showMessage(
          "아이디와 비밀번호를 입력해주세요."
        );

        return;
      }


      const button =
        document.getElementById(
          "loginButton"
        );

      button.disabled = true;
      button.textContent =
        "로그인 중...";


      try {
        const result =
          await apiRequest({
            action: "login",
            userId: userId,
            password: password
          });


        if (!result.success) {
          showMessage(
            result.message ||
            "로그인에 실패했습니다."
          );

          return;
        }


        localStorage.setItem(
          "budgetToken",
          result.token
        );

        localStorage.setItem(
          "budgetUserId",
          result.userId
        );

        localStorage.setItem(
          "budgetNickname",
          result.nickname || ""
        );


        window.location.href =
          "index.html";

      } catch (error) {
        console.error(error);

        showMessage(
          "서버 연결에 실패했습니다."
        );

      } finally {
        button.disabled = false;
        button.textContent =
          "로그인";
      }
    }


    /* =========================================
       회원가입
    ========================================= */

    async function signup() {
      clearMessage();


      const nickname =
        document
          .getElementById("nickname")
          .value
          .trim();


      const userId =
        document
          .getElementById("signupId")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const passwordConfirm =
        document
          .getElementById(
            "signupPasswordConfirm"
          )
          .value;


      if (!nickname) {
        showMessage(
          "닉네임을 입력해주세요."
        );

        return;
      }


      if (
        !/^[a-zA-Z0-9_-]{4,20}$/
          .test(userId)
      ) {
        showMessage(
          "아이디는 영문, 숫자, _, -를 사용해 4~20자로 만들어주세요."
        );

        return;
      }


      if (password.length < 8) {
        showMessage(
          "비밀번호는 8자 이상으로 만들어주세요."
        );

        return;
      }


      if (
        password !==
        passwordConfirm
      ) {
        showMessage(
          "비밀번호가 서로 일치하지 않습니다."
        );

        return;
      }


      const button =
        document.getElementById(
          "signupButton"
        );

      button.disabled = true;
      button.textContent =
        "가입 중...";


      try {
        const result =
          await apiRequest({
            action: "signup",
            nickname: nickname,
            userId: userId,
            password: password
          });


        if (!result.success) {
          showMessage(
            result.message ||
            "회원가입에 실패했습니다."
          );

          return;
        }


        showMessage(
          "회원가입이 완료되었습니다. 이제 로그인해주세요.",
          "success"
        );


        document
          .getElementById("loginId")
          .value = userId;


        document
          .getElementById("nickname")
          .value = "";

        document
          .getElementById("signupId")
          .value = "";

        document
          .getElementById(
            "signupPassword"
          )
          .value = "";

        document
          .getElementById(
            "signupPasswordConfirm"
          )
          .value = "";


        setTimeout(function() {
          showTab("login");

          document
            .getElementById(
              "loginId"
            )
            .value = userId;

          showMessage(
            "회원가입이 완료되었습니다. 로그인해주세요.",
            "success"
          );

        }, 700);


      } catch (error) {
        console.error(error);

        showMessage(
          "서버 연결에 실패했습니다."
        );

      } finally {
        button.disabled = false;
        button.textContent =
          "회원가입";
      }
    }


    /* =========================================
       기존 로그인 확인
    ========================================= */

    async function checkExistingLogin() {
      const token =
        localStorage.getItem(
          "budgetToken"
        );

      if (!token) {
        return;
      }


      try {
        const result =
          await apiRequest({
            action: "verify",
            token: token
          });


        if (result.success) {
          window.location.href =
            "index.html";

          return;
        }


        localStorage.removeItem(
          "budgetToken"
        );

        localStorage.removeItem(
          "budgetUserId"
        );

        localStorage.removeItem(
          "budgetNickname"
        );

      } catch (error) {
        console.error(error);
      }
    }


    /* =========================================
       엔터키
    ========================================= */

    document
      .getElementById(
        "loginPassword"
      )
      .addEventListener(
        "keydown",
        function(event) {
          if (event.key === "Enter") {
            login();
          }
        }
      );


    document
      .getElementById(
        "signupPasswordConfirm"
      )
      .addEventListener(
        "keydown",
        function(event) {
          if (event.key === "Enter") {
            signup();
          }
        }
      );


    checkExistingLogin();

  </script>

</body>
</html>
