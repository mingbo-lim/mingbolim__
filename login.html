<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>로그인 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #f8f5ed,
          #eef4eb
        );

      font-family:
        "Noto Sans KR",
        sans-serif;

      color: #292d29;
    }

    .login-wrap {
      width: 90%;
      max-width: 420px;
    }

    .login-card {
      padding: 45px 38px;

      background: #fffefa;

      border: 1px solid #e5e1d8;
      border-radius: 18px;

      box-shadow:
        0 15px 40px
        rgba(70, 65, 55, 0.08);
    }

    .logo {
      margin-bottom: 28px;
      text-align: center;
    }

    .logo-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .logo h1 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .logo p {
      margin: 0;

      color: #969990;

      font-family:
        "Gowun Dodum",
        sans-serif;

      font-size: 12px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;

      padding: 0 14px;

      border: 1px solid #dcdad4;
      border-radius: 8px;

      background: white;

      font-family: inherit;
      font-size: 13px;

      outline: none;
    }

    input:focus {
      border-color: #75a284;

      box-shadow:
        0 0 0 3px
        rgba(78, 138, 104, 0.08);
    }

    .login-button {
      width: 100%;
      height: 47px;

      margin-top: 8px;

      border: 0;
      border-radius: 8px;

      background: #5f9270;
      color: white;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .login-button:hover {
      background: #477b5a;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 20px;

      margin-top: 15px;

      color: #c05d55;

      font-size: 11px;
      text-align: center;
    }

    .bottom-message {
      margin-top: 22px;

      color: #969990;

      font-family:
        "Gowun Dodum",
        sans-serif;

      font-size: 11px;
      line-height: 1.7;

      text-align: center;
    }

  </style>
</head>


<body>

<div class="login-wrap">

  <div class="login-card">

    <div class="logo">

      <span class="logo-icon">
        🌿
      </span>

      <h1>
        나의 가계부
      </h1>

      <p>
        오늘의 기록이 내일의 여유가 되도록
      </p>

    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="loginId">
          아이디
        </label>

        <input
          id="loginId"
          type="text"
          autocomplete="username"
          placeholder="아이디를 입력해주세요"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          비밀번호
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호를 입력해주세요"
          required
        >

      </div>


      <button
        class="login-button"
        id="loginButton"
        type="submit"
      >
        로그인
      </button>


      <div
        class="message"
        id="message"
      ></div>

    </form>


    <div class="bottom-message">
      🌿 나만의 작은 가계부
    </div>

  </div>

</div>


<script>

/* 새로 배포한 Apps Script 주소 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwERhUl3c_U-jlNCVGPE4y-uOyiq1fW8z4cRjLuvn2AeZhBXMv3JRlwZdg-O1ZQI2M9NQ/exec";


const loginForm =
  document.getElementById("loginForm");


const loginButton =
  document.getElementById("loginButton");


const message =
  document.getElementById("message");


/*
  이미 로그인 토큰이 있더라도
  로그인 페이지에서는 자동 이동시키지 않음.

  실제 토큰 확인은 index.html에서 진행.
*/


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const id =
      document
        .getElementById("loginId")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    if (!id || !password) {

      message.textContent =
        "아이디와 비밀번호를 입력해주세요.";

      return;
    }


    message.textContent = "";

    loginButton.disabled = true;

    loginButton.textContent =
      "로그인 중...";


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify({
                action: "login",
                id: id,
                password: password
              })
          }
        );


      if (!response.ok) {

        throw new Error(
          "서버 응답 오류"
        );

      }


      const result =
        await response.json();


      if (
        result.success === true &&
        result.token
      ) {

        /*
          비밀번호는 브라우저에 저장하지 않음.

          서버가 발급한 임시 토큰만 저장.
        */

        sessionStorage.setItem(
          "ledgerToken",
          result.token
        );


        /*
          혹시 예전 로그인 방식의 값이
          남아 있다면 삭제
        */

        sessionStorage.removeItem(
          "ledgerLoggedIn"
        );


        window.location.replace(
          "index.html"
        );

        return;
      }


      message.textContent =
        result.message ||
        "아이디 또는 비밀번호를 확인해주세요.";


    } catch (error) {

      console.error(
        "로그인 오류:",
        error
      );


      message.textContent =
        "서버 연결 중 오류가 발생했어요.";

    }


    loginButton.disabled = false;

    loginButton.textContent =
      "로그인";

  }
);

</script>

</body>
</html>
