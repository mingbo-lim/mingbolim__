<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #eef5ec 0, transparent 35%),
        linear-gradient(135deg, #f8f8f3 0%, #f2f5ef 100%);
      color: #252a26;
      font-family: "Noto Sans KR", sans-serif;
    }

    .login-wrap {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      margin-bottom: 22px;
      text-align: center;
    }

    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #e9f2ea;
      font-size: 29px;
    }

    .brand h1 {
      margin: 0;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 27px;
      font-weight: 400;
    }

    .brand p {
      margin: 8px 0 0;
      color: #737a74;
      font-size: 13px;
    }

    .login-card {
      padding: 34px;
      border: 1px solid #e6e9e3;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 40px rgba(64, 75, 65, 0.08);
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 27px;
      color: #737a74;
      font-size: 13px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe5dd;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #252a26;
      font-family: inherit;
      font-size: 14px;
    }

    .field input:focus {
      border-color: #8bae8a;
      box-shadow: 0 0 0 3px rgba(139, 174, 138, 0.13);
    }

    .login-button {
      width: 100%;
      height: 50px;
      margin-top: 5px;
      border: 0;
      border-radius: 13px;
      background: #5f9270;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: #4f805f;
    }

    .login-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: #b44f48;
    }

    .message.success {
      display: block;
      background: #edf6ee;
      color: #467653;
    }

    .signup {
      margin-top: 22px;
      text-align: center;
      color: #737a74;
      font-size: 13px;
    }

    .signup a {
      color: #3f7455;
      font-weight: 700;
      text-decoration: none;
    }

    .small-note {
      margin-top: 18px;
      text-align: center;
      color: #a1a6a1;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
        padding: 55px 18px 30px;
      }

      .login-card {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrap">

    <div class="brand">
      <div class="brand-icon">🌿</div>
      <h1>나의 가계부</h1>
      <p>오늘의 기록이 내일의 여유가 되도록</p>
    </div>

    <section class="login-card">

      <h2>로그인</h2>

      <p class="description">
        내 가계부를 확인하려면 로그인해주세요.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="userId">아이디</label>

          <input
            type="text"
            id="userId"
            autocomplete="username"
            placeholder="아이디를 입력해주세요"
            required
          >
        </div>

        <div class="field">
          <label for="password">비밀번호</label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="비밀번호를 입력해주세요"
            required
          >
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          로그인
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="signup">
        아직 계정이 없나요?
        <a href="./login.html">회원가입</a>
      </div>

    </section>

    <div class="small-note">
      차곡차곡 기록하는 나의 소비 생활
    </div>

  </main>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxtLbgJ80BlSABX7utMyeeGQZ5C6Pt8xItzE6p12Xa6AcRPIAawmpMC4eh3M6V-uLcWqA/exec";

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const messageBox =
      document.getElementById("message");


    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className =
        "message " + type;
    }


    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }


    async function apiRequest(data) {

      const response =
        await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=UTF-8"
          },

          body:
            JSON.stringify(data)
        });


      const text =
        await response.text();


      try {
        return JSON.parse(text);

      } catch (error) {
        console.error(text);

        throw new Error(
          "서버 응답을 확인할 수 없습니다."
        );
      }
    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        const userId =
          document
            .getElementById("userId")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!userId || !password) {
          showMessage(
            "아이디와 비밀번호를 입력해주세요."
          );

          return;
        }


        loginButton.disabled = true;
        loginButton.textContent =
          "로그인 중...";


        try {

          const result =
            await apiRequest({
              action: "login",
              userId: userId,
              password: password
            });


          if (!result.success) {
            showMessage(
              result.message ||
              "로그인에 실패했습니다."
            );

            return;
          }


          /*
            login.html과 같은 저장 방식 사용
          */

          localStorage.setItem(
            "budgetToken",
            result.token
          );

          localStorage.setItem(
            "budgetUserId",
            result.userId || userId
          );

          localStorage.setItem(
            "budgetNickname",
            result.nickname || ""
          );


          /*
            기존 코드와의 호환용
          */

          sessionStorage.setItem(
            "ledgerToken",
            result.token
          );

          sessionStorage.setItem(
            "userId",
            result.userId || userId
          );

          sessionStorage.setItem(
            "nickname",
            result.nickname || ""
          );


          showMessage(
            "로그인되었습니다.",
            "success"
          );


          /*
            로그인 성공 후
            기록 페이지로 이동
          */

          setTimeout(function() {
            window.location.href =
              "./write.html";
          }, 300);


        } catch (error) {

          console.error(error);

          showMessage(
            "서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요."
          );


        } finally {

          loginButton.disabled = false;
          loginButton.textContent =
            "로그인";
        }
      }
    );


    /*
      이미 로그인되어 있으면
      기록 페이지로 이동
    */

    async function verifyExistingLogin() {

      const token =
        localStorage.getItem(
          "budgetToken"
        ) ||
        sessionStorage.getItem(
          "ledgerToken"
        );


      if (!token) {
        return;
      }


      try {

        const result =
          await apiRequest({
            action: "verify",
            token: token
          });


        if (result.success) {

          localStorage.setItem(
            "budgetToken",
            token
          );

          localStorage.setItem(
            "budgetUserId",
            result.userId || ""
          );

          localStorage.setItem(
            "budgetNickname",
            result.nickname || ""
          );

          window.location.href =
            "./write.html";

          return;
        }


        localStorage.removeItem(
          "budgetToken"
        );

        localStorage.removeItem(
          "budgetUserId"
        );

        localStorage.removeItem(
          "budgetNickname"
        );

        sessionStorage.removeItem(
          "ledgerToken"
        );

        sessionStorage.removeItem(
          "userId"
        );

        sessionStorage.removeItem(
          "nickname"
        );


      } catch (error) {
        console.error(
          "자동 로그인 확인 실패:",
          error
        );
      }
    }


    verifyExistingLogin();

  </script>

</body>
</html>
