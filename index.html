<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>회원가입 | 나의 가계부</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background:
        radial-gradient(
          circle at 15% 15%,
          #edf4ea 0,
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 85%,
          #f7f1df 0,
          transparent 30%
        ),
        #f7f8f3;
    }


    .auth-layout {
      display: grid;

      grid-template-columns:
        1fr 460px;

      width: 100%;
      max-width: 1080px;

      min-height: 680px;

      overflow: hidden;

      border:
        1px solid #e5e9e2;

      border-radius: 26px;

      background:
        rgba(255, 255, 255, 0.96);

      box-shadow:
        0 25px 70px
        rgba(64, 75, 65, 0.10);
    }


    /* =========================
       왼쪽 소개
    ========================= */

    .auth-visual {
      position: relative;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 55px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #e7f0e4,
          #f4f2df
        );
    }


    .visual-logo {
      display: flex;
      align-items: center;

      gap: 11px;
    }


    .visual-logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 46px;
      height: 46px;

      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.7);

      font-size: 25px;
    }


    .visual-logo strong {
      font-size: 17px;
      letter-spacing: -0.5px;
    }


    .visual-copy {
      position: relative;

      z-index: 2;

      max-width: 440px;
    }


    .visual-copy span {
      display: inline-block;

      margin-bottom: 16px;

      padding: 7px 11px;

      border-radius: 99px;

      background:
        rgba(255, 255, 255, 0.65);

      color: #557461;

      font-size: 10px;
      font-weight: 600;
    }


    .visual-copy h1 {
      margin: 0 0 17px;

      color: #29352d;

      font-size:
        clamp(30px, 4vw, 46px);

      line-height: 1.35;

      letter-spacing: -2px;
    }


    .visual-copy p {
      margin: 0;

      color: #708075;

      font-family:
        "Gowun Dodum",
        sans-serif;

      font-size: 14px;

      line-height: 1.9;
    }


    .visual-decoration {
      position: absolute;

      right: 30px;
      bottom: 20px;

      font-size: 125px;

      opacity: 0.15;

      transform:
        rotate(-8deg);
    }


    .visual-bottom {
      color: #78857b;

      font-family:
        "Gowun Dodum",
        sans-serif;

      font-size: 11px;
    }


    /* =========================
       회원가입 영역
    ========================= */

    .auth-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;

      padding: 45px 48px;
    }


    .mobile-logo {
      display: none;

      margin-bottom: 30px;

      text-align: center;
    }


    .mobile-logo-icon {
      display: block;

      margin-bottom: 8px;

      font-size: 35px;
    }


    .mobile-logo strong {
      font-size: 19px;
    }


    .auth-heading {
      margin-bottom: 25px;
    }


    .auth-heading span {
      display: block;

      margin-bottom: 7px;

      color: #789080;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.4px;
    }


    .auth-heading h2 {
      margin: 0 0 8px;

      font-size: 26px;

      letter-spacing: -1px;
    }


    .auth-heading p {
      margin: 0;

      color: #9aa19a;

      font-size: 11px;
    }


    .auth-form
    .form-group {
      margin-bottom: 15px;
    }


    .auth-form label {
      display: block;

      margin-bottom: 7px;

      color: #555d56;

      font-size: 11px;
      font-weight: 600;
    }


    .auth-input {
      width: 100%;
      height: 47px;

      padding: 0 15px;

      border:
        1px solid #dfe3dc;

      border-radius: 10px;

      background: #fcfdfb;

      color: #252a26;

      font-family: inherit;
      font-size: 13px;

      outline: none;

      transition: 0.2s ease;
    }


    .auth-input:focus {
      border-color: #8fb49a;

      background: white;

      box-shadow:
        0 0 0 4px
        rgba(95, 146, 112, 0.08);
    }


    .input-help {
      margin: 6px 2px 0;

      color: #a2a7a1;

      font-size: 9px;

      line-height: 1.5;
    }


    .password-wrap {
      position: relative;
    }


    .password-wrap
    .auth-input {
      padding-right: 55px;
    }


    .password-toggle {
      position: absolute;

      top: 50%;
      right: 12px;

      transform:
        translateY(-50%);

      padding: 5px;

      border: 0;

      background: transparent;

      color: #899089;

      font-size: 10px;
    }


    .signup-button {
      width: 100%;
      height: 50px;

      margin-top: 7px;

      border: 0;

      border-radius: 10px;

      background: #527f61;

      color: white;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      box-shadow:
        0 8px 18px
        rgba(82, 127, 97, 0.18);

      transition: 0.2s ease;
    }


    .signup-button:hover {
      transform: translateY(-1px);

      background: #416d51;
    }


    .signup-button:disabled {
      transform: none;

      opacity: 0.55;

      cursor: wait;
    }


    .auth-message {
      min-height: 21px;

      margin-top: 12px;

      color: #cc6666;

      font-size: 10px;

      line-height: 1.6;

      text-align: center;
    }


    .auth-message.success {
      color: #527f61;
    }


    .login-box {
      margin-top: 16px;

      padding-top: 17px;

      border-top:
        1px solid #eceee9;

      text-align: center;
    }


    .login-box p {
      margin: 0 0 10px;

      color: #969c96;

      font-size: 10px;
    }


    .login-link {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 44px;

      border:
        1px solid #a8c2ae;

      border-radius: 10px;

      background: #f9fbf8;

      color: #4f7a5e;

      font-size: 11px;
      font-weight: 600;

      transition: 0.2s ease;
    }


    .login-link:hover {
      background: #edf4eb;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 780px) {

      body {
        align-items: flex-start;

        padding: 25px 17px;

        background: #f7f8f3;
      }


      .auth-layout {
        display: block;

        max-width: 440px;

        min-height: 0;

        border-radius: 20px;
      }


      .auth-visual {
        display: none;
      }


      .auth-panel {
        padding: 34px 27px;
      }


      .mobile-logo {
        display: block;
      }


      .auth-heading {
        text-align: center;
      }


      .auth-heading h2 {
        font-size: 23px;
      }

    }

  </style>
</head>


<body>

<div class="auth-layout">


  <!-- 왼쪽 소개 -->

  <section class="auth-visual">

    <div class="visual-logo">

      <div class="visual-logo-icon">
        🌿
      </div>

      <strong>
        나의 가계부
      </strong>

    </div>


    <div class="visual-copy">

      <span>
        START MY BUDGET
      </span>

      <h1>
        나만의 가계부를<br>
        만들어볼까요?
      </h1>

      <p>
        회원가입하면 나만의 기록 공간이 만들어져요.<br>
        다른 사람의 가계부와 섞이지 않고<br>
        내 소비만 차근차근 기록할 수 있어요.
      </p>

    </div>


    <div class="visual-decoration">
      🌱
    </div>


    <div class="visual-bottom">
      오늘부터 시작하는 나만의 작은 기록
    </div>

  </section>


  <!-- 회원가입 -->

  <section class="auth-panel">


    <div class="mobile-logo">

      <span class="mobile-logo-icon">
        🌿
      </span>

      <strong>
        나의 가계부
      </strong>

    </div>


    <div class="auth-heading">

      <span>
        CREATE ACCOUNT
      </span>

      <h2>
        새 가계부 만들기
      </h2>

      <p>
        나만의 계정을 만들어주세요.
      </p>

    </div>


    <form
      id="signupForm"
      class="auth-form"
    >


      <!-- 닉네임 -->

      <div class="form-group">

        <label for="nickname">
          닉네임
        </label>

        <input
          id="nickname"
          class="auth-input"
          type="text"
          maxlength="20"
          autocomplete="nickname"
          placeholder="예: 밍보"
          required
        >

        <p class="input-help">
          로그인하면 ‘밍보의 가계부’처럼 표시돼요.
        </p>

      </div>


      <!-- 아이디 -->

      <div class="form-group">

        <label for="signupId">
          아이디
        </label>

        <input
          id="signupId"
          class="auth-input"
          type="text"
          minlength="4"
          maxlength="20"
          autocomplete="username"
          placeholder="아이디를 입력해주세요"
          required
        >

        <p class="input-help">
          영문, 숫자, _, -를 사용해 4~20자로 만들어주세요.
        </p>

      </div>


      <!-- 비밀번호 -->

      <div class="form-group">

        <label for="signupPassword">
          비밀번호
        </label>


        <div class="password-wrap">

          <input
            id="signupPassword"
            class="auth-input"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="8자 이상 입력해주세요"
            required
          >

          <button
            id="passwordToggle"
            class="password-toggle"
            type="button"
          >
            보기
          </button>

        </div>

      </div>


      <!-- 비밀번호 확인 -->

      <div class="form-group">

        <label for="passwordConfirm">
          비밀번호 확인
        </label>

        <input
          id="passwordConfirm"
          class="auth-input"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="비밀번호를 다시 입력해주세요"
          required
        >

      </div>


      <button
        id="signupButton"
        class="signup-button"
        type="submit"
      >
        내 가계부 만들기
      </button>


      <div
        id="message"
        class="auth-message"
      ></div>

    </form>


    <div class="login-box">

      <p>
        이미 가계부가 있나요?
      </p>

      <a
        href="login.html"
        class="login-link"
      >
        로그인하러 가기
      </a>

    </div>

  </section>

</div>


<script>

/* =========================================
   API
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzedrpedwYtEaVvtdojzfoovU9SIRqhcn9rqz2lLH50w-1HOyetfJfLOkT-mMIq7G3PrQ/exec";


/* =========================================
   요소
========================================= */

const signupForm =
  document.getElementById(
    "signupForm"
  );


const signupButton =
  document.getElementById(
    "signupButton"
  );


const message =
  document.getElementById(
    "message"
  );


const passwordInput =
  document.getElementById(
    "signupPassword"
  );


const passwordConfirm =
  document.getElementById(
    "passwordConfirm"
  );


const passwordToggle =
  document.getElementById(
    "passwordToggle"
  );


/* =========================================
   비밀번호 보기
========================================= */

passwordToggle.addEventListener(
  "click",
  function() {

    const show =
      passwordInput.type ===
      "password";


    passwordInput.type =
      show
        ? "text"
        : "password";


    passwordConfirm.type =
      show
        ? "text"
        : "password";


    passwordToggle.textContent =
      show
        ? "숨기기"
        : "보기";

  }
);


/* =========================================
   회원가입
========================================= */

signupForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    message.classList.remove(
      "success"
    );


    message.textContent =
      "";


    const nickname =
      document
        .getElementById(
          "nickname"
        )
        .value
        .trim();


    const id =
      document
        .getElementById(
          "signupId"
        )
        .value
        .trim();


    const password =
      passwordInput.value;


    const confirmPassword =
      passwordConfirm.value;


    /* 입력 확인 */

    if (
      !nickname ||
      !id ||
      !password ||
      !confirmPassword
    ) {

      message.textContent =
        "모든 항목을 입력해주세요.";

      return;
    }


    /* 아이디 확인 */

    if (
      !/^[a-zA-Z0-9_-]{4,20}$/.test(
        id
      )
    ) {

      message.textContent =
        "아이디는 영문, 숫자, _, -를 사용해 4~20자로 만들어주세요.";

      return;
    }


    /* 비밀번호 */

    if (
      password.length < 8
    ) {

      message.textContent =
        "비밀번호는 8자 이상으로 만들어주세요.";

      return;
    }


    if (
      password !==
      confirmPassword
    ) {

      message.textContent =
        "비밀번호가 서로 일치하지 않아요.";

      return;
    }


    signupButton.disabled =
      true;


    signupButton.textContent =
      "가계부 만드는 중...";


    try {

      const result =
        await apiRequest({

          action: "signup",

          id: id,

          password: password,

          nickname: nickname

        });


      if (!result.success) {

        message.textContent =
          result.message ||
          "회원가입에 실패했어요.";


        signupButton.disabled =
          false;


        signupButton.textContent =
          "내 가계부 만들기";


        return;
      }


      /*
        회원가입 성공
      */

      message.classList.add(
        "success"
      );


      message.textContent =
        nickname +
        "의 가계부가 만들어졌어요! 🌿";


      signupButton.textContent =
        "완료!";


      /*
        1초 후 로그인 화면
      */

      setTimeout(
        function() {

          window.location.replace(
            "login.html"
          );

        },
        1000
      );


    } catch (error) {

      console.error(
        "회원가입 오류:",
        error
      );


      message.textContent =
        "서버 연결 중 오류가 발생했어요.";


      signupButton.disabled =
        false;


      signupButton.textContent =
        "내 가계부 만들기";

    }

  }
);


/* =========================================
   서버 요청
========================================= */

async function apiRequest(data) {

  const response =
    await fetch(
      API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=UTF-8"
        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      "서버 응답 오류"
    );

  }


  return await response.json();

}

</script>

</body>

</html>
