<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #eef5ec 0, transparent 35%),
        linear-gradient(135deg, #f8f8f3 0%, #f2f5ef 100%);
      color: #252a26;
      font-family: "Noto Sans KR", sans-serif;
    }

    .signup-wrap {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      margin-bottom: 22px;
      text-align: center;
    }

    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: #e9f2ea;
      font-size: 29px;
    }

    .brand h1 {
      margin: 0;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 27px;
      font-weight: 400;
    }

    .brand p {
      margin: 8px 0 0;
      color: #737a74;
      font-size: 13px;
    }

    .signup-card {
      padding: 34px;
      border: 1px solid #e6e9e3;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 40px rgba(64, 75, 65, 0.08);
    }

    .signup-card h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 27px;
      color: #737a74;
      font-size: 13px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #dfe5dd;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #252a26;
      font-family: inherit;
      font-size: 14px;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: #8bae8a;
      box-shadow: 0 0 0 3px rgba(139, 174, 138, 0.13);
    }

    .hint {
      margin-top: 6px;
      color: #929892;
      font-size: 11px;
      line-height: 1.5;
    }

    .signup-button {
      width: 100%;
      height: 50px;
      margin-top: 5px;
      border: 0;
      border-radius: 13px;
      background: #5f9270;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .signup-button:hover {
      background: #4f805f;
    }

    .signup-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: #b44f48;
    }

    .message.success {
      display: block;
      background: #edf6ee;
      color: #467653;
    }

    .login-link {
      margin-top: 22px;
      text-align: center;
      color: #737a74;
      font-size: 13px;
    }

    .login-link a {
      color: #3f7455;
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      body {
        align-items: flex-start;
        padding: 40px 18px 30px;
      }

      .signup-card {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="signup-wrap">

    <div class="brand">
      <div class="brand-icon">🌿</div>
      <h1>나의 가계부</h1>
      <p>나만의 가계부를 시작해보세요.</p>
    </div>

    <section class="signup-card">

      <h2>회원가입</h2>
      <p class="description">
        사용할 계정 정보를 입력해주세요.
      </p>

      <form id="signupForm">

        <div class="field">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            maxlength="20"
            placeholder="예: 밍보"
            required
          >
        </div>

        <div class="field">
          <label for="userId">아이디</label>
          <input
            type="text"
            id="userId"
            minlength="4"
            maxlength="20"
            autocomplete="username"
            placeholder="아이디를 입력해주세요"
            required
          >
          <div class="hint">
            영문, 숫자, _, - 를 사용할 수 있어요. (4~20자)
          </div>
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="비밀번호를 입력해주세요"
            required
          >
          <div class="hint">
            8자 이상 입력해주세요.
          </div>
        </div>

        <div class="field">
          <label for="passwordConfirm">비밀번호 확인</label>
          <input
            type="password"
            id="passwordConfirm"
            minlength="8"
            autocomplete="new-password"
            placeholder="비밀번호를 한 번 더 입력해주세요"
            required
          >
        </div>

        <button
          type="submit"
          class="signup-button"
          id="signupButton"
        >
          회원가입
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="login-link">
        이미 계정이 있나요?
        <a href="./login.html">로그인</a>
      </div>

    </section>

  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzedrpedwYtEaVvtdojzfoovU9SIRqhcn9rqz2lLH50w-1HOyetfJfLOkT-mMIq7G3PrQ/exec";

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    async function apiRequest(data) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify(data)
      });

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error("서버 응답을 확인할 수 없습니다.");
      }
    }

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessage();

      const nickname =
        document.getElementById("nickname").value.trim();

      const userId =
        document.getElementById("userId").value.trim();

      const password =
        document.getElementById("password").value;

      const passwordConfirm =
        document.getElementById("passwordConfirm").value;

      if (!nickname || !userId || !password || !passwordConfirm) {
        showMessage("모든 항목을 입력해주세요.");
        return;
      }

      if (!/^[a-zA-Z0-9_-]{4,20}$/.test(userId)) {
        showMessage(
          "아이디는 영문, 숫자, _, - 만 사용하여 4~20자로 입력해주세요."
        );
        return;
      }

      if (password.length < 8) {
        showMessage("비밀번호는 8자 이상 입력해주세요.");
        return;
      }

      if (password !== passwordConfirm) {
        showMessage("비밀번호가 서로 일치하지 않습니다.");
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "가입 중...";

      try {
        const result = await apiRequest({
          action: "signup",
          nickname: nickname,
          userId: userId,
          password: password
        });

        if (!result.success) {
          showMessage(
            result.message || "회원가입에 실패했습니다."
          );
          return;
        }

        showMessage(
          "회원가입이 완료되었습니다! 로그인 화면으로 이동합니다.",
          "success"
        );

        setTimeout(function () {
          window.location.href = "./login.html";
        }, 900);

      } catch (error) {
        console.error(error);

        showMessage(
          "서버 연결에 실패했습니다. 잠시 후 다시 시도해주세요."
        );

      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "회원가입";
      }
    });
  </script>

</body>
</html>
