<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>회원가입 | 나의 가계부</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background:
        linear-gradient(
          135deg,
          #f8f5ed,
          #eef4eb
        );

      font-family:
        "Noto Sans KR",
        sans-serif;

      color: #292d29;
    }

    .signup-wrap {
      width: 100%;
      max-width: 430px;
    }

    .signup-card {
      padding: 42px 38px;

      background: #fffefa;

      border: 1px solid #e5e1d8;
      border-radius: 18px;

      box-shadow:
        0 15px 40px
        rgba(70, 65, 55, 0.08);
    }

    .logo {
      margin-bottom: 28px;
      text-align: center;
    }

    .logo-icon {
      display: block;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .logo h1 {
      margin: 0 0 8px;

      font-size: 25px;
      letter-spacing: -1px;
    }

    .logo p {
      margin: 0;

      color: #969990;

      font-family:
        "Gowun Dodum",
        sans-serif;

      font-size: 12px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 11px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;

      padding: 0 14px;

      border: 1px solid #dcdad4;
      border-radius: 8px;

      background: white;

      font-family: inherit;
      font-size: 13px;

      outline: none;
    }

    input:focus {
      border-color: #75a284;

      box-shadow:
        0 0 0 3px
        rgba(78, 138, 104, 0.08);
    }

    .help {
      margin: 6px 2px 0;

      color: #9b9c96;

      font-size: 10px;
      line-height: 1.5;
    }

    .signup-button {
      width: 100%;
      height: 47px;

      margin-top: 8px;

      border: 0;
      border-radius: 8px;

      background: #5f9270;
      color: white;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .signup-button:hover {
      background: #477b5a;
    }

    .signup-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 20px;

      margin-top: 15px;

      color: #c05d55;

      font-size: 11px;
      line-height: 1.6;

      text-align: center;
    }

    .message.success {
      color: #4e8a68;
    }

    .login-link {
      margin-top: 22px;

      color: #969990;

      font-size: 11px;
      text-align: center;
    }

    .login-link a {
      margin-left: 4px;

      color: #4e8a68;

      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

  </style>
</head>


<body>

<div class="signup-wrap">

  <div class="signup-card">

    <div class="logo">

      <span class="logo-icon">
        🌿
      </span>

      <h1>
        나의 가계부
      </h1>

      <p>
        나만의 가계부를 만들어보세요
      </p>

    </div>


    <form id="signupForm">

      <!-- 닉네임 -->

      <div class="form-group">

        <label for="nickname">
          닉네임
        </label>

        <input
          id="nickname"
          type="text"
          maxlength="20"
          placeholder="가계부에서 사용할 이름"
          autocomplete="nickname"
          required
        >

      </div>


      <!-- 아이디 -->

      <div class="form-group">

        <label for="signupId">
          아이디
        </label>

        <input
          id="signupId"
          type="text"
          minlength="4"
          maxlength="20"
          placeholder="아이디를 입력해주세요"
          autocomplete="username"
          required
        >

        <p class="help">
          영문, 숫자, _, -를 사용해 4~20자로 만들어주세요.
        </p>

      </div>


      <!-- 비밀번호 -->

      <div class="form-group">

        <label for="signupPassword">
          비밀번호
        </label>

        <input
          id="signupPassword"
          type="password"
          minlength="8"
          placeholder="8자 이상 입력해주세요"
          autocomplete="new-password"
          required
        >

      </div>


      <!-- 비밀번호 확인 -->

      <div class="form-group">

        <label for="passwordConfirm">
          비밀번호 확인
        </label>

        <input
          id="passwordConfirm"
          type="password"
          minlength="8"
          placeholder="비밀번호를 한 번 더 입력해주세요"
          autocomplete="new-password"
          required
        >

      </div>


      <button
        class="signup-button"
        id="signupButton"
        type="submit"
      >
        회원가입
      </button>


      <div
        class="message"
        id="message"
      ></div>

    </form>


    <div class="login-link">

      이미 계정이 있나요?

      <a href="login.html">
        로그인
      </a>

    </div>

  </div>

</div>


<script>

/* =========================================
   새 Apps Script 주소
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwI2qqnKHp2CRumgKEnVO8arJaV77vhYPydrV_mTugmIguVDRuuBfwTo-F0Do4h6gYx5A/exec";


const signupForm =
  document.getElementById(
    "signupForm"
  );


const signupButton =
  document.getElementById(
    "signupButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* =========================================
   회원가입
========================================= */

signupForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const nickname =
      document
        .getElementById("nickname")
        .value
        .trim();


    const id =
      document
        .getElementById("signupId")
        .value
        .trim();


    const password =
      document
        .getElementById("signupPassword")
        .value;


    const passwordConfirm =
      document
        .getElementById("passwordConfirm")
        .value;


    message.classList.remove(
      "success"
    );


    /* 비밀번호 확인 */

    if (
      password !==
      passwordConfirm
    ) {

      message.textContent =
        "비밀번호가 서로 일치하지 않아요.";

      return;

    }


    /* 비밀번호 길이 */

    if (
      password.length < 8
    ) {

      message.textContent =
        "비밀번호는 8자 이상으로 만들어주세요.";

      return;

    }


    /* 아이디 형식 */

    if (
      !/^[a-zA-Z0-9_-]{4,20}$/.test(id)
    ) {

      message.textContent =
        "아이디는 영문, 숫자, _, -를 사용해 4~20자로 만들어주세요.";

      return;

    }


    signupButton.disabled =
      true;


    signupButton.textContent =
      "가입 중...";


    message.textContent =
      "";


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },

            body:
              JSON.stringify({

                action: "signup",

                id: id,

                password: password,

                nickname: nickname

              })
          }
        );


      if (!response.ok) {

        throw new Error(
          "서버 응답 오류"
        );

      }


      const result =
        await response.json();


      if (result.success) {

        message.classList.add(
          "success"
        );


        message.textContent =
          "회원가입 완료! 로그인 화면으로 이동할게요 🌿";


        signupButton.textContent =
          "가입 완료";


        /*
          가입 후 로그인 화면으로 이동
        */

        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          1200
        );


        return;

      }


      message.textContent =
        result.message ||
        "회원가입에 실패했어요.";


    } catch (error) {

      console.error(
        "회원가입 오류:",
        error
      );


      message.textContent =
        "서버 연결 중 오류가 발생했어요.";

    }


    signupButton.disabled =
      false;


    signupButton.textContent =
      "회원가입";

  }
);

</script>

</body>
</html>
